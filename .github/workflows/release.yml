name: Publish Python 🐍 distribution 📦 to PyPI
on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  test:
    name: Lint and test the code 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs needs tags to derive the version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: 'pip'
      - name: Install hatch
        run: python -m pip install hatch --user
      - name: Lint
        run: hatch fmt --check
      - name: Type check
        run: hatch run types:check
      - name: Test
        run: hatch test

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: 'pip'
      - name: Install pypa/build
        run: python3 -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mkgallery
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - publish-to-pypi
    steps:
      - name: Create GitHub Release (stable)
        uses: softprops/action-gh-release@v2
        if: |
          !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc')
        with:
          generate_release_notes: true
      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        if: |
          contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')
        with:
          prerelease: true
          generate_release_notes: true

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mkgallery"
dynamic = ["version"]
description = "Summarise a photo collection as a single gallery page"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.txt"]
dependencies = [
    "click",
    "imagehash",
    "jinja2",
    "numpy",
    "Pillow>=12.3.0",
    "platformdirs",
    "pyexiftool",
    "rawpy",
    "scikit-learn",
    "scipy",
]

[project.scripts]
mkgallery = "mkgallery.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/mkgallery/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mkgallery"]

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/mkgallery tests}"

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.14.10"]
config-path = "none"

[tool.mypy]
disable_error_code = ["import-not-found", "import-untyped"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
